<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#111827">
<title>K-pop Chat Simulator</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#172033}
button,input{font:inherit}
button{cursor:pointer;border:0}
.app{height:100dvh;display:flex;justify-content:center}
.screen{width:100%;max-width:760px;height:100%;display:none;flex-direction:column}
.screen.active{display:flex}
.start{justify-content:center;align-items:center;padding:24px;background:linear-gradient(160deg,#fdf2ff,#eef7ff)}
.logo{width:88px;height:88px;border-radius:28px;background:linear-gradient(135deg,#ff7eb9,#6fd3ff);display:grid;place-items:center;color:white;font-size:38px;font-weight:900;box-shadow:0 16px 35px #0002}
h1{margin:18px 0 8px;text-align:center;font-size:clamp(28px,8vw,46px)}
.subtitle{text-align:center;color:#667085;margin:0 0 28px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(100%,520px)}
.choice button,.primary{min-height:58px;border-radius:18px;color:white;font-weight:800;font-size:17px;box-shadow:0 8px 20px #0002}
.girl{background:linear-gradient(135deg,#ff6fae,#c56cff)}
.boy{background:linear-gradient(135deg,#35b9ff,#6b7cff)}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#fff;border-bottom:1px solid #e8ebf2;flex-shrink:0}
.back{width:46px;height:46px;border-radius:14px;background:#eef2f7;font-size:22px}
.toptext{min-width:0}.toptext h2{margin:0;font-size:20px}.toptext p{margin:2px 0 0;color:#7b8495;font-size:13px}
.scroll{flex:1;overflow:auto;padding:18px;-webkit-overflow-scrolling:touch}
.sectionTitle{margin:0 0 14px;font-size:24px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{background:#fff;border:1px solid #e9edf4;border-radius:20px;padding:16px;box-shadow:0 7px 20px #1822300d;transition:.15s}
.card:active{transform:scale(.98)}
.avatar{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;color:white;font-weight:900;font-size:21px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:17px;overflow-wrap:anywhere}
.card p{margin:0;color:#6d7687;font-size:13px;line-height:1.45}
.tag{display:inline-block;margin:7px 5px 0 0;padding:5px 8px;border-radius:999px;background:#f0f3f8;color:#566070;font-size:11px}
.chat{background:#edf2f8}
.messages{flex:1;overflow:auto;padding:18px 14px;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:82%;padding:11px 14px;border-radius:18px;line-height:1.4;font-size:15px;word-break:break-word}
.member{align-self:flex-start;background:#fff;border-bottom-left-radius:5px;box-shadow:0 3px 10px #0000000d}
.user{align-self:flex-end;background:#5b6cff;color:white;border-bottom-right-radius:5px}
.composer{padding:10px;display:flex;gap:8px;background:#fff;border-top:1px solid #e3e7ef;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.composer input{min-width:0;flex:1;border:1px solid #dbe1ea;border-radius:16px;padding:13px 14px;outline:none}
.composer input:focus{border-color:#7180ff}
.send{min-width:70px;border-radius:16px;background:#5b6cff;color:#fff;font-weight:800}
.empty{color:#7c8595;text-align:center;padding:30px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}.scroll{padding:24px}}
@media(max-width:390px){.grid{gap:10px}.card{padding:13px}.choice{grid-template-columns:1fr}.avatar{width:52px;height:52px}}
</style>
</head>
<body>
<div class="app">
<section id="start" class="screen active start">
  <div class="logo">♫</div>
  <h1>K-pop Chat Simulator</h1>
  <p class="subtitle">Choose a group type to begin your fictional fan chat.</p>
  <div class="choice">
    <button class="girl" onclick="chooseType('girlGroups')">Girl Group</button>
    <button class="boy" onclick="chooseType('boyGroups')">Boy Group</button>
  </div>
</section>

<section id="groups" class="screen">
  <header class="topbar"><button class="back" onclick="goStart()">←</button><div class="toptext"><h2>Choose a Group</h2><p>Fictional groups • altered names</p></div></header>
  <main class="scroll"><h2 class="sectionTitle">Groups</h2><div id="groupGrid" class="grid"></div></main>
</section>

<section id="members" class="screen">
  <header class="topbar"><button class="back" onclick="goGroups()">←</button><div class="toptext"><h2 id="memberTitle"></h2><p>Select someone to chat with</p></div></header>
  <main class="scroll"><div id="memberGrid" class="grid"></div></main>
</section>

<section id="chat" class="screen chat">
  <header class="topbar"><button class="back" onclick="goMembers()">←</button><div class="toptext"><h2 id="chatTitle"></h2><p id="chatSub"></p></div></header>
  <main id="messages" class="messages"></main>
  <form id="composer" class="composer"><input id="messageInput" autocomplete="off" placeholder="Type a friendly message..."><button class="send">Send</button></form>
</section>
</div>

let selectedType=null, selectedGroup=null, selectedMember=null;
const $=id=>document.getElementById(id);
const screens=["start","groups","members","chat"];
function show(id){screens.forEach(x=>$(x).classList.toggle("active",x===id))}
function chooseType(type){selectedType=type;renderGroups();show("groups")}
function goStart(){show("start")}
function goGroups(){renderGroups();show("groups")}
function goMembers(){renderMembers();show("members")}
function renderGroups(){
  const box=$("groupGrid"); box.innerHTML="";
  kpopData[selectedType].forEach(g=>{
    const el=document.createElement("button"); el.className="card"; el.style.textAlign="left";
    el.innerHTML=`<div class="avatar" style="background:${g.color}">${g.name.slice(0,2)}</div><h3>${g.name}</h3><p>${g.members.length} fictional members</p>`;
    el.onclick=()=>{selectedGroup=g;renderMembers();show("members")}; box.appendChild(el);
  });
}
function renderMembers(){
  $("memberTitle").textContent=selectedGroup.name;
  const box=$("memberGrid"); box.innerHTML="";
  selectedGroup.members.forEach(m=>{
    const el=document.createElement("button"); el.className="card"; el.style.textAlign="left";
    el.innerHTML=`<div class="avatar" style="background:${m.color}">${m.initials}</div><h3>${m.name}</h3><p>${m.positions.join(" • ")}</p><div>${m.personality.interests.map(x=>`<span class="tag">${x}</span>`).join("")}</div>`;
    el.onclick=()=>openChat(m); box.appendChild(el);
  });
}
function openChat(m){
  selectedMember=m;
  $("chatTitle").textContent=m.name;
  $("chatSub").textContent=selectedGroup.name+" • "+m.positions.join(" • ");
  $("messages").innerHTML="";
  addBubble(randomChoice(m.personality.greetings),"member");
  show("chat");
  setTimeout(()=>{$("messageInput").focus()},50);
}
function randomChoice(a){return a[Math.floor(Math.random()*a.length)]}
function addBubble(text,type){
  const b=document.createElement("div"); b.className="bubble "+type; b.textContent=text;
  $("messages").appendChild(b); $("messages").scrollTop=$("messages").scrollHeight;
}
function generateReply(member,text){
  const t=text.toLowerCase();
  if(/\b(hi|hello|hey|hii)\b/.test(t)) return randomChoice(member.personality.greetings);
  if(/song|music|sing|singing/.test(t)) return randomChoice([
    "Music is always a fun topic! I hope you find a song you love today.",
    ...member.personality.sampleReplies
  ]);
  if(/concert|stage|performance/.test(t)) return "Stage time is exciting! The energy and teamwork make performances special.";
  if(/dance|dancing|practice/.test(t)) return `Practice can be challenging, but ${member.personality.interests[0]} keeps me motivated!`;
  if(/how are you|how r u|how's it going/.test(t)) return "I'm doing well! Thanks for asking. Hope you're having a great day too!";
  return randomChoice(member.personality.sampleReplies);
}
$("composer").addEventListener("submit",e=>{
  e.preventDefault();
  const input=$("messageInput"), text=input.value.trim(); if(!text)return;
  addBubble(text,"user"); input.value=""; input.focus();
  const delay=600+Math.random()*900;
  setTimeout(()=>addBubble(generateReply(selectedMember,text),"member"),delay);
});
document.addEventListener("touchmove",e=>{if(e.target.closest(".chat,.scroll"))return;e.preventDefault()},{passive:false});
document.addEventListener("dblclick",e=>e.preventDefault());
</script>
